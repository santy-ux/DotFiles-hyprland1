# BACKGROUND
background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 5
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# GENERAL
general {
    no_fade_in = false
    grace = 0
    disable_loading_bar = false
}

# INPUT FIELD
input-field {
    monitor =
    size = 190, 42
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(0, 0, 0, 0)
    inner_color = rgba(100, 114, 125, 0.5)
    font_color = rgb(200, 200, 200)
    fade_on_empty = false
    font_family = SF Pro Display Bold
    placeholder_text = <i><span foreground="##ffffff99">Hi, $USER</span></i>
    hide_input = false
    position = 0, -210
    halign = center
    valign = center
}

# Hour
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%H")"
    color = rgba(255, 255, 255, .6)
    font_size = 120
    font_family = Alfa Slab One
    position = 0, 210
    halign = center
    valign = center
}

# Minute
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%M")"
    color = rgba(255, 255, 255, .6)
    font_size = 120
    font_family = Alfa Slab One
    position = 0, 55
    halign = center
    valign = center
}

# Day-Date-Month
label {
    monitor =
    text = cmd[update:1000] echo "<span color='##ffffff99'>$(date '+%A, ')</span><span color='##ffffff99'>$(date '+%d %B')</span>"
    font_size = 22
    font_family = SF Pro Display Bold
    position = 0, -55
    halign = center
    valign = center
}

# USER ICON
label {
    monitor =
    text = 
    color = rgba(255, 255, 255, .65)
    font_size = 70
    font_family = JetBrains Mono Nerd
    position = 0, -130
    halign = center
    valign = center
}

# CURRENT SONG
label {
    monitor =
    text = cmd[update:1000] echo "$(~/.config/hypr/scripts/songdetail.sh)"
    color = rgba(255, 255, 255, 0.7)
    font_size = 14
    font_family = JetBrains Mono Nerd, SF Pro Display Bold
    position = 0, 40
    halign = center
    valign = bottom
}
